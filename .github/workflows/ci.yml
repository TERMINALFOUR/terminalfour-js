name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development dependencies (informational)
        # Development tooling is never published, so advisories there are reported but do not fail the build.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
